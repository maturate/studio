services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: superos
      POSTGRES_PASSWORD: superos
      POSTGRES_DB: superos_workflow_studio
    ports:
      - "5433:5432"
    volumes:
      - superos_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - superos_redis_data:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: superos
      MINIO_ROOT_PASSWORD: superos-dev-key
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - superos_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 superos superos-dev-key &&
      mc mb -p local/superos-assets &&
      exit 0
      "

volumes:
  superos_postgres_data:
  superos_redis_data:
  superos_minio_data:
